name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python-Referenz, Text- und Stil-Lint
        run: |
          pip install -r sim-reference/requirements.txt
          python tools/text_lint.py
          python tools/style_lint.py
          cd sim-reference && python -m pytest -q

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: C#-Simulationskern (NUnit gegen Golden Files)
        run: dotnet test "sim-core/com.sfe.simcore/Dotnet~/Tests/SFE.SimCore.Tests.csproj"
